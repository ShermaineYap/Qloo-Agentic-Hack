services:
  - type: web
    name: toursmith
    runtime: docker
    plan: starter # free instances sleep after 15 min idle; judges would wait ~50s on first load
    healthCheckPath: /healthz
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_TRUSTED_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: GEMINI_API_KEY
        sync: false
